<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSGEM - Cloud Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary-cloud: #0d6efd;
            --hover-cloud: #0056b3;
        }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
        .table-container { background: rgba(255,255,255,0.9); padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); backdrop-filter: blur(5px); }
        .navbar { background: rgba(13, 110, 253, 0.9) !important; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.2); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; letter-spacing: 1px; }
        .btn { border-radius: 10px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
        .btn:hover { transform: scale(1.08) rotate(-1deg); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.95); }
        .btn::after {
            content: ""; background: rgba(255,255,255,0.3); position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%; transition: all 0.4s; transform: skewX(-20deg);
        }
        .btn:hover::after { left: 100%; }
        .form-control { border-radius: 10px; padding: 12px; border: 2px solid transparent; transition: all 0.3s ease; }
        .form-control:focus { border-color: var(--primary-cloud); box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.15); transform: scale(1.02); }
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(3px);
        }
        .cloud-icon { font-size: 1.8rem; margin-right: 10px; animation: cloudFloat 3s ease-in-out infinite; display: inline-block; }
        @keyframes cloudFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .row-animate { animation: fadeInRight 0.5s ease-out both; }
        .badge-schema { background: #e9ecef; color: #495057; font-family: monospace; padding: 5px 10px; border-radius: 6px; border: 1px solid #dee2e6; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="text-center">
        <div class="spinner-grow text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <div class="mt-2 fw-bold text-primary">Sincronizando com a Nuvem...</div>
    </div>
</div>

<nav class="navbar navbar-dark sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand d-flex align-items-center animate__animated animate__fadeInLeft">
            <i class="bi bi-cloud-check-fill cloud-icon"></i> SYSGEM
        </span>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-4">
                <h5 class="card-title mb-3">Nova Organização</h5>
                <form id="orgForm" class="row g-3">
                    <div class="col-md-9">
                        <input type="text" id="nome" class="form-control" style="text-transform: uppercase;" placeholder="Nome da Igreja / Organização" required>
                        <div id="validationFeedback" class="form-text"></div>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-plus-circle"></i> Criar Organização
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="table-container">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="m-0">Organizações Cadastradas</h5>
                    <button onclick="carregarOrganizacoes()" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Nº</th>
                                <th>Nome</th>
                                <th>Schema</th>
                                <th>Criado em</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="orgTableBody">
                            <!-- Injetado via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Confirmação Exclusão -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirmar Exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Tem certeza que deseja excluir a organização <strong><span id="deleteOrgName"></span></strong>?
                <br>
                <small class="text-danger">Aviso: O schema e todos os dados serão permanentemente removidos.</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Excluir</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notifications -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="toastTitle">Notificação</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
